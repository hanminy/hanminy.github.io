<text x="729" y="352" font-size="13" fill="#595959" text-anchor="start" font-weight="400">MP4 압축 파일 크기 아님</text>
<text x="40" y="396" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="400">비압축 RGB 1프레임은 숫자 페이로드의 약 3,905배 — 저장·전송 설계의 지배 항은 영상</text>
