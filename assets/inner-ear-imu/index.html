<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:19px;line-height:1.7;word-break:keep-all}

<body>
<div class="wrap">
<header>
  <h1>귀 속의 IMU</h1>

</header>

  <canvas id="cv" role="img" aria-label="귀 속 전정기관과 MEMS 관성 센서를 비교하는 모션그래픽"></canvas>

  <span class="time" id="time">0:00 / 0:00</span>
  <button class="c" id="fs" type="button">전체화면</button>
</div>
<div class="chap" id="chap"></div>
<div class="more">
  함께 보기: <a href="../bppv-guide/">이석증 완전 가이드</a><br>
  그림은 원리를 보여 주는 단순화된 모형이며, 그래프의 시간 축은 보기 좋게 줄였습니다.
</div>
</div>

<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=1280,H=720;
const FAM='-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const F=(s,w=700)=>`${w} ${s}px ${FAM}`;
const INK='#1b1b1b',INK2='#4a463f',PAPER='#f4eee1',PAPER2='#fbf7ee',YEL='#ffd60a',RED='#e4572e',TEAL='#2a9d8f',TEAL2='#8fd3c7',BLUE='#3d5a80',ORANGE='#f4a261',CR='#f08a24',BONE='#efe2c8',SKIN='#f2c9a5',FLUID='#a8dadc',GRAY='#9aa5ad';

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-clamp(x),3);

const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
let BOIL=0;
function jit(seed,a=1.2){const v=Math.sin(seed*127.1+BOIL*311.7)*43758.5453;return((v-Math.floor(v))*2-1)*a;}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function card(x,y,w,h,fill,o={}){const r=o.r??10,sh=o.sh??7;ctx.save();ctx.fillStyle='rgba(0,0,0,.17)';rr(x+sh,y+sh,w,h,r);ctx.fill();ctx.fillStyle=fill;rr(x,y,w,h,r);ctx.fill();if(o.stroke!==false){ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();}ctx.restore();}
function text(s,x,y,size,o={}){ctx.font=F(size,o.weight||700);ctx.fillStyle=o.color||INK;ctx.textAlign=o.align||'left';ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);}
function fade(a,fn){if(a<=0)return;ctx.save();ctx.globalAlpha*=clamp(a);fn();ctx.restore();}
function hl(x,y,w,h,p,color=YEL){if(p<=0)return;ctx.save();ctx.fillStyle=color;const ww=w*clamp(p);ctx.beginPath();ctx.moveTo(x,y+jit(1,2));ctx.lineTo(x+ww,y+jit(2,2));ctx.lineTo(x+ww+jit(3,3),y+h);ctx.lineTo(x+jit(4,2),y+h+jit(5,2));ctx.closePath();ctx.fill();ctx.restore();}
function hlText(s,x,y,size,p,o={}){ctx.font=F(size,o.weight||800);const w=ctx.measureText(s).width;if(o.align==='center')x-=w/2;hl(x-10,y-size*.8,w+20,size*1.05,p,o.hcol||YEL);fade(clamp(p*3),()=>text(s,x,y,size,{color:o.color,weight:o.weight||800}));}
function arrow(x1,y1,x2,y2,p=1,o={}){if(p<=0)return;const color=o.color||INK,w=o.w||4,head=o.head||14;const xe=x1+(x2-x1)*p,ye=y1+(y2-y1)*p;ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=w;ctx.lineCap='round';const mx=(x1+xe)/2+jit(13,2),my=(y1+ye)/2+jit(14,2);ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx,my,xe,ye);ctx.stroke();const a=Math.atan2(ye-my,xe-mx);ctx.beginPath();ctx.moveTo(xe+Math.cos(a)*4,ye+Math.sin(a)*4);ctx.lineTo(xe-head*Math.cos(a-.45),ye-head*Math.sin(a-.45));ctx.lineTo(xe-head*Math.cos(a+.45),ye-head*Math.sin(a+.45));ctx.closePath();ctx.fill();ctx.restore();}
function tag(s,x,y,size,p,o={}){if(p<=0)return;ctx.save();ctx.font=F(size,800);const w=ctx.measureText(s).width+size*1.2,h=size*1.75;const sc=back(p);ctx.translate(x+jit(21,1),y+jit(22,1));ctx.scale(sc,sc);card(-w/2,-h/2,w,h,o.fill||'#fff',{r:8,sh:5});text(s,0,size*.36,size,{color:o.color||INK,align:'center',weight:800});ctx.restore();}
function stamp(s,x,y,p,color=RED){if(p<=0)return;ctx.save();ctx.translate(x,y);ctx.rotate(-.12);const sc=1+(1-eo(p))*.8;ctx.scale(sc,sc);ctx.globalAlpha*=clamp(p*1.6);ctx.font=F(34,900);const w=ctx.measureText(s).width+40;ctx.strokeStyle=color;ctx.lineWidth=5;ctx.strokeRect(-w/2,-31,w,62);ctx.lineWidth=2;ctx.strokeRect(-w/2+6,-25,w-12,50);text(s,0,12,34,{color,align:'center',weight:900});ctx.restore();}
function tube(path,o={}){const w=o.w||24;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=w;ctx.strokeStyle=INK;ctx.stroke(path);ctx.lineWidth=w-9;ctx.strokeStyle=o.fill||BONE;ctx.stroke(path);ctx.restore();}
function spring(x1,y,x2,n=8,a=12){ctx.beginPath();ctx.moveTo(x1,y);for(let k=1;k<n;k++)ctx.lineTo(x1+(x2-x1)*k/n,y+(k%2?-a:a));ctx.lineTo(x2,y);ctx.stroke();}
function speed(x,y,w,h,off,alpha=.3){ctx.save();rr(x,y,w,h,10);ctx.clip();ctx.strokeStyle=`rgba(27,27,27,${alpha})`;ctx.lineWidth=3;ctx.lineCap='round';const span=w+200;for(let i=0;i<9;i++){const yy=y+30+i*(h-60)/8,len=40+(i*37)%70;const xx=(((i*197-off)%span)+span)%span+x-100;ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+len,yy);ctx.stroke();}ctx.restore();}
function graph(x,y,w,h,o){card(x,y,w,h,'#fffaf0',{r:8,sh:5});const t0=o.t0||0,t1=o.t1,ymin=o.ymin,ymax=o.ymax;const X=tt=>x+16+(tt-t0)/(t1-t0)*(w-32),Y=v=>y+h-14-(clamp(v,ymin,ymax)-ymin)/(ymax-ymin)*(h-44);ctx.save();ctx.strokeStyle='#cfc6b3';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+12,Y(0));ctx.lineTo(x+w-12,Y(0));ctx.stroke();const te=Math.min(o.tNow,t1);(o.series||[]).forEach(s=>{ctx.save();ctx.strokeStyle=s.color;ctx.lineWidth=s.w||4;ctx.lineJoin='round';if(s.dash)ctx.setLineDash(s.dash);ctx.beginPath();let first=true;const st=(t1-t0)/360;for(let tt=t0;tt<=te+1e-9;tt+=st){const px=X(tt),py=Y(s.f(tt));first?ctx.moveTo(px,py):ctx.lineTo(px,py);first=false;}ctx.stroke();ctx.restore();});ctx.restore();if(o.label)text(o.label,x+18,y+28,18,{color:INK2});let lx=x+w-18;(o.legend||[]).slice().reverse().forEach(l=>{ctx.font=F(16,700);const tw=ctx.measureText(l.name).width;text(l.name,lx,y+27,16,{color:INK2,align:'right'});ctx.save();ctx.strokeStyle=l.color;ctx.lineWidth=4;if(l.dash)ctx.setLineDash(l.dash);ctx.beginPath();ctx.moveTo(lx-tw-34,y+21);ctx.lineTo(lx-tw-8,y+21);ctx.stroke();ctx.restore();lx-=tw+52;});return{X,Y};}

/* characters & icons */
const HEAD=new Path2D('M -70 -95 C -20 -135 70 -120 90 -60 C 100 -35 98 -20 102 -8 L 122 22 C 126 30 118 34 108 34 L 104 52 C 104 62 98 66 88 66 L 70 66 L 66 100 L -40 100 L -40 70 C -90 50 -115 -40 -70 -95 Z');
function head(x,y,s,o={}){ctx.save();ctx.translate(x,y);ctx.rotate(o.rot||0);ctx.scale(s,s);ctx.save();ctx.translate(7,7);ctx.fillStyle='rgba(0,0,0,.17)';ctx.fill(HEAD);ctx.restore();ctx.fillStyle=o.fill||SKIN;ctx.fill(HEAD);ctx.lineWidth=4/s*1.3;ctx.strokeStyle=INK;ctx.stroke(HEAD);ctx.fillStyle='#3b2f2a';ctx.beginPath();ctx.moveTo(-70,-95);ctx.bezierCurveTo(-20,-135,70,-120,88,-64);ctx.bezierCurveTo(40,-90,-10,-70,-40,-40);ctx.bezierCurveTo(-60,-20,-80,-10,-88,10);ctx.bezierCurveTo(-104,-30,-95,-70,-70,-95);ctx.fill();ctx.beginPath();ctx.arc(62,-30,6,0,7);ctx.fillStyle=INK;ctx.fill();ctx.beginPath();ctx.ellipse(-5,-5,16,24,0,0,7);ctx.fillStyle=SKIN;ctx.fill();ctx.lineWidth=4/s*1.3;ctx.stroke();ctx.restore();}
function headTop(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle='rgba(0,0,0,.17)';ctx.beginPath();ctx.arc(5,5,r,0,7);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.fillStyle=SKIN;ctx.beginPath();ctx.ellipse(-r,0,r*.17,r*.32,0,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(r,0,r*.17,r*.32,0,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-r*.24,-r*.9);ctx.lineTo(0,-r*1.28);ctx.lineTo(r*.24,-r*.9);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#3b2f2a';ctx.beginPath();ctx.arc(0,0,r-2,.05*PI,.95*PI);ctx.closePath();ctx.fill();ctx.restore();}
function faceFront(x,y,r,o={}){const sh=o.shift||0,pu=o.pupil||0;ctx.save();ctx.translate(x,y);ctx.rotate(o.rot||0);ctx.fillStyle='rgba(0,0,0,.17)';ctx.beginPath();ctx.arc(6,6,r,0,7);ctx.fill();ctx.fillStyle=SKIN;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();ctx.save();ctx.beginPath();ctx.arc(0,0,r-2,0,7);ctx.clip();ctx.fillStyle='#3b2f2a';ctx.fillRect(-r,-r,2*r,r*.55);ctx.restore();[-1,1].forEach(sd=>{const ex=sd*r*.36+sh,ey=-r*.08;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,ey,r*.2,r*.14,0,0,7);ctx.fill();ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=INK;ctx.beginPath();ctx.arc(ex+pu,ey-r*.03+(o.pupY||0),r*.08,0,7);ctx.fill();});ctx.beginPath();ctx.moveTo(sh,-r*.02);ctx.lineTo(sh+r*.08,r*.22);ctx.lineTo(sh-r*.04,r*.24);ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(sh,r*.38,r*.2,.15*PI,.85*PI);ctx.stroke();ctx.restore();}
function chipIcon(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='rgba(0,0,0,.17)';ctx.fillRect(-22,-22,52,52);ctx.strokeStyle=INK;ctx.lineWidth=4;for(let k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(-34,k*12);ctx.lineTo(34,k*12);ctx.stroke();ctx.beginPath();ctx.moveTo(k*12,-34);ctx.lineTo(k*12,34);ctx.stroke();}ctx.fillStyle=INK;ctx.fillRect(-26,-26,52,52);ctx.fillStyle=YEL;ctx.fillRect(-12,-12,24,24);ctx.restore();}
function eyeIcon(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#fff';ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-34,0);ctx.quadraticCurveTo(0,-34,34,0);ctx.quadraticCurveTo(0,34,-34,0);ctx.fill();ctx.stroke();ctx.fillStyle=BLUE;ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fill();ctx.fillStyle=INK;ctx.beginPath();ctx.arc(0,0,5,0,7);ctx.fill();ctx.restore();}
function earIcon(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle=SKIN;ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-6,30);ctx.bezierCurveTo(-30,24,-28,-34,4,-34);ctx.bezierCurveTo(30,-34,30,0,12,10);ctx.bezierCurveTo(4,16,8,30,-6,30);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(2,-6,10,PI*.9,PI*2.2);ctx.stroke();ctx.restore();}
function jointIcon(x,y){ctx.save();ctx.translate(x,y);ctx.strokeStyle=INK;ctx.lineCap='round';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(-28,-28);ctx.lineTo(0,0);ctx.lineTo(-6,32);ctx.stroke();ctx.lineWidth=8;ctx.strokeStyle=BONE;ctx.stroke();ctx.fillStyle=RED;ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();}
function camIcon(x,y){ctx.save();ctx.translate(x,y);card(-32,-20,64,42,'#cfd6db',{r:6,sh:4});ctx.fillStyle=INK;ctx.beginPath();ctx.arc(0,1,13,0,7);ctx.fill();ctx.fillStyle=BLUE;ctx.beginPath();ctx.arc(0,1,7,0,7);ctx.fill();ctx.fillStyle=INK;ctx.fillRect(-14,-28,16,8);ctx.restore();}
function gearIcon(x,y,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=GRAY;ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();for(let k=0;k<16;k++){const a=k/16*2*PI,r=k%2?22:30;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=PAPER;ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();ctx.stroke();ctx.restore();}
function brain(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);const B=[[-40,-10,34],[-10,-30,36],[25,-20,34],[38,12,30],[5,20,34],[-30,18,30]];ctx.fillStyle='rgba(0,0,0,.17)';B.forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(a+6,b+6,r,0,7);ctx.fill();});ctx.fillStyle='#f3b5c0';ctx.strokeStyle=INK;ctx.lineWidth=4;B.forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(a,b,r,0,7);ctx.stroke();});B.forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(a,b,r-2,0,7);ctx.fill();});ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-40,-6);ctx.bezierCurveTo(-20,-20,-10,10,10,-6);ctx.bezierCurveTo(24,-18,30,10,44,0);ctx.stroke();ctx.beginPath();ctx.moveTo(-20,24);ctx.bezierCurveTo(-6,10,10,34,26,18);ctx.stroke();ctx.restore();}
const PLANE={body:new Path2D('M -110 0 C -110 -16 -80 -20 -40 -20 L 80 -20 C 110 -20 125 -8 132 0 C 125 8 110 14 80 14 L -90 14 C -105 14 -110 8 -110 0 Z'),tail:new Path2D('M -96 -16 L -122 -64 L -92 -64 L -58 -18 Z'),wing:new Path2D('M -12 6 L 42 6 L -18 50 L -52 50 Z')};
function plane(x,y,s,rot,ghost){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);if(ghost){ctx.setLineDash([10,8]);ctx.lineWidth=3;ctx.strokeStyle=RED;['tail','body','wing'].forEach(k=>ctx.stroke(PLANE[k]));}else{ctx.save();ctx.translate(6,6);ctx.fillStyle='rgba(0,0,0,.17)';['tail','body','wing'].forEach(k=>ctx.fill(PLANE[k]));ctx.restore();ctx.lineWidth=3.5;ctx.strokeStyle=INK;ctx.fillStyle=BLUE;ctx.fill(PLANE.tail);ctx.stroke(PLANE.tail);ctx.fillStyle='#fff';ctx.fill(PLANE.body);ctx.stroke(PLANE.body);ctx.fillStyle=BLUE;ctx.fill(PLANE.wing);ctx.stroke(PLANE.wing);ctx.fillStyle=INK;for(let k=0;k<6;k++){ctx.beginPath();ctx.arc(-50+k*22,-6,4,0,7);ctx.fill();}}ctx.restore();}

/* labyrinth */
function spiralPath(){let s='M -40 55 ';const cx=-150,cy=120;for(let i=0;i<=120;i++){const a=-.2*PI+i/120*PI*4.4;const r=70-i/120*56;s+='L '+(cx+Math.cos(a)*r).toFixed(1)+' '+(cy+Math.sin(a)*r).toFixed(1)+' ';}return new Path2D(s);}
const LAB={ant:new Path2D('M -35 -30 C -130 -60 -120 -210 -25 -205 C 65 -200 70 -110 5 -42'),post:new Path2D('M 35 -35 C 70 -130 170 -200 225 -135 C 270 -80 190 -25 70 -15'),lat:new Path2D('M 60 15 C 150 5 250 45 225 105 C 200 150 110 120 55 40'),coch:spiralPath()};
function drawLab(cx,cy,s,o={}){if(s<.01)return;ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);const cf=o.canal||[BONE,BONE,BONE];tube(LAB.coch,{fill:o.coch||BONE,w:26});tube(LAB.ant,{fill:cf[0]});tube(LAB.post,{fill:cf[1]});tube(LAB.lat,{fill:cf[2]});[[-62,-40,0],[45,-60,1],[86,12,2]].forEach(([x,y,i])=>{ctx.beginPath();ctx.arc(x,y,15,0,7);ctx.fillStyle=cf[i];ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.stroke();});ctx.fillStyle=o.oto||BONE;ctx.lineWidth=4;ctx.strokeStyle=INK;ctx.beginPath();ctx.ellipse(10,0,70,40,0,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(-15,58,38,28,0,0,7);ctx.fill();ctx.stroke();for(let i=0;i<9;i++){ctx.fillStyle=CR;ctx.beginPath();ctx.arc(-35+i*11,-6+(i%2)*5,4.5,0,7);ctx.fill();}for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(-30+i*10,58+(i%2)*4,4,0,7);ctx.fill();}ctx.restore();}

/* ---------- precomputed simulations ---------- */
